[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kimodo-mcp"
version = "0.1.0"
description = "Local Model Context Protocol bridge for Kimodo motion generation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.28,<2", "pydantic>=2.11,<3", "numpy>=1.26,<3", "filelock>=3.20.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[project.scripts]
kimodo-mcp = "kimodo_mcp.server:main"
kimodo-mcp-worker = "kimodo_mcp.worker_service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kimodo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
